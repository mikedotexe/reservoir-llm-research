[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir-research"
version = "0.1.0"
description = "Local, source-preserving research tools for Astrid and Minime journals"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["numpy"]
analysis = ["numpy", "matplotlib"]

[project.scripts]
reservoir-research = "reservoir_research.cli:main"

[tool.setuptools.packages.find]
include = ["reservoir_research*"]
